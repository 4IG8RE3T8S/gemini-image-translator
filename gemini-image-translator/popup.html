<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<style>
  body { width: 250px; padding: 14px; font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.5; margin: 0; box-sizing: border-box; }
  h4 { margin: 0 0 8px 0; font-size: 14px; color: #1a73e8; }
  p { margin: 0 0 12px 0; color: #555; }
  button { width: 100%; padding: 8px; cursor: pointer; border-radius: 4px; font-size: 13px; font-family: inherit; }
  .btn-primary { background: #1a73e8; color: #fff; border: 1px solid #1a73e8; font-weight: 500; margin-bottom: 8px; }
  .btn-primary:hover { background: #1557b0; }
  .btn-secondary { background: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; }
  .btn-secondary:hover { background: #e8eaed; }
</style>
</head>
<body>
  <h4>Gemini Image Translator</h4>
  <p>คลิกขวาที่รูปเพื่อแปล หรือกดปุ่มด้านล่างเพื่อลากกรอบเลือกพื้นที่หน้าจอ</p>
  <button id="captureAreaBtn" class="btn-primary">📐 ลากกรอบเลือกพื้นที่เพื่อแปล</button>
  <button id="openOptions" class="btn-secondary">⚙️ เปิดหน้าตั้งค่า</button>
  <script src="popup.js"></script>
</body>
</html>
