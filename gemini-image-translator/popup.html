<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<style>
  body { width: 260px; padding: 14px; font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.5; margin: 0; box-sizing: border-box; }
  h4 { margin: 0 0 8px 0; font-size: 14px; color: #1a73e8; display: flex; align-items: center; justify-content: space-between; }
  p { margin: 0 0 12px 0; color: #555; }
  button { width: 100%; padding: 8px; cursor: pointer; border-radius: 4px; font-size: 13px; font-family: inherit; }
  .btn-primary { background: #1a73e8; color: #fff; border: 1px solid #1a73e8; font-weight: 500; margin-bottom: 8px; }
  .btn-primary:hover { background: #1557b0; }
  .btn-secondary { background: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; margin-bottom: 8px; }
  .btn-secondary:hover { background: #e8eaed; }
  .badge { font-size: 10px; background: #e8f0fe; color: #1a73e8; padding: 2px 6px; border-radius: 8px; font-weight: normal; }
</style>
</head>
<body>
  <h4>
    Gemini Translator
    <span class="badge">GT Fallback</span>
  </h4>
  <p>คลิกขวาที่รูปเพื่อแปล หรือกดปุ่มด้านล่างเพื่อลากกรอบเลือกพื้นที่หน้าจอ</p>
  <div style="margin-bottom: 10px; background: #f8f9fa; padding: 8px 10px; border-radius: 6px; border: 1px solid #e8eaed;">
    <label for="textBackgroundModePopup" style="display: block; font-size: 11px; font-weight: 600; color: #3c4043; margin-bottom: 4px;">
      🎨 สไตล์พื้นหลังข้อความแปล:
    </label>
    <select id="textBackgroundModePopup" style="width: 100%; padding: 6px 8px; border: 1px solid #dadce0; border-radius: 4px; font-size: 12px; font-family: inherit; background: #fff; cursor: pointer; color: #202124;">
      <option value="blur">🌫️ Blur (กระจกฝ้า แนะนำ)</option>
      <option value="solid">⬜ Solid (พื้นหลังทึบ 1-3px)</option>
      <option value="transparent">🔍 Transparent (โปร่งใส ขอบขาว)</option>
    </select>
  </div>
  <button id="captureAreaBtn" class="btn-primary">📐 ลากกรอบแปลด้วย Gemini</button>
  <button id="captureAreaGtBtn" class="btn-secondary">🌐 ลากกรอบแปลด้วย Google Translate</button>
  <button id="openCollectorBtn" class="btn-secondary">🖼️ ตัวเก็บภาพมังงะ (Image Collector)</button>
  <button id="openGoogleTranslateBtn" class="btn-secondary">🚀 เปิด Google Translate Images</button>
  <button id="openOptions" class="btn-secondary" style="margin-bottom: 0;">⚙️ เปิดหน้าตั้งค่า</button>
  <script src="popup.js"></script>
</body>
</html>
